# ============================================================
# Kyuubi Defaults Configuration
# - 连接 Spark Master（standalone 模式）
# - 使用 MinIO 作为 S3 存储
# - 集成 Hive Metastore
# ============================================================

# ==================== Kyuubi 引擎配置 ====================

# 引擎类型：使用 Spark 引擎
kyuubi.engine.type                    SPARK_SQL

# Spark 版本
kyuubi.engine.spark.version           3.4.1

# ==================== Spark Master 连接 ====================

# Spark Master 地址（K8s DNS）
kyuubi.engine.spark.master            spark://spark-master.lakehouse.svc.cluster.local:7077

# Spark 部署模式（客户端模式，Kyuubi 直接连接 Master）
kyuubi.engine.deploy.mode             cluster

# ==================== Kyuubi 服务配置 ====================

# Kyuubi Frontend 绑定主机
kyuubi.frontend.bind.host             0.0.0.0

# Thrift Binary 端口（Beeline / JDBC 连接端口）
kyuubi.frontend.thrift.binary.bind.port  10009

# REST API 端口
kyuubi.frontend.rest.bind.port        10099

# ==================== 认证配置 ====================

# 认证类型（不启用认证）
kyuubi.authentication                 NONE

# ==================== 引擎 JAR 包配置 ====================
# 使用 PVC 挂载的本地 JAR 包，不在线下载

kyuubi.session.engine.spark.extra.classpath  /opt/hadoop-libs/kyuubi/*

# ==================== Spark Session 配置（传递给 Spark 引擎） ====================

# Delta Lake 扩展
spark.sql.extensions                  io.delta.sql.DeltaSparkSessionExtension

# Delta Lake Catalog
spark.sql.catalog.spark_catalog       org.apache.spark.sql.delta.catalog.DeltaCatalog

# MinIO 端点
spark.hadoop.fs.s3a.endpoint          http://minio.minio.svc.cluster.local:9000

# MinIO Access Key
spark.hadoop.fs.s3a.access.key        amdin

# MinIO Secret Key
spark.hadoop.fs.s3a.secret.key        amdin12345

# S3A 路径样式访问
spark.hadoop.fs.s3a.path.style.access true

# S3A 文件系统实现
spark.hadoop.fs.s3a.impl              org.apache.hadoop.fs.s3a.S3AFileSystem

# 凭证提供者
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Hive MetaStore URI
spark.hadoop.hive.metastore.uris      thrift://hive-metastore.lakehouse.svc.cluster.local:9083

# Warehouse 路径
spark.sql.warehouse.dir               s3a://warehouse/kyuubi

# 事件日志目录
spark.eventLog.enabled                true
spark.eventLog.dir                    s3a://sparkhistory/eventlogs

# JAR 包路径
spark.jars                            /opt/hadoop-libs/spark/delta-core_2.12-2.4.0.jar,\
                                      /opt/hadoop-libs/spark/delta-storage-2.4.0.jar,\
                                      /opt/hadoop-libs/spark/hadoop-aws-3.3.6.jar,\
                                      /opt/hadoop-libs/spark/aws-java-sdk-bundle-1.11.271.jar,\
                                      /opt/hadoop-libs/kyuubi/kyuubi-spark-connector-hive_2.12-1.8.0.jar,\
                                      /opt/hadoop-libs/kyuubi/kyuubi-extension-spark-3-4_2.12-1.8.0.jar

# ==================== 引擎共享策略 ====================

# 引擎共享级别（USER 级别共享，每个用户一个引擎）
kyuubi.engine.share.level             USER

# 引擎空闲超时（30分钟无操作则回收）
kyuubi.session.engine.idle.timeout    30min

# ==================== 日志配置 ====================

# 操作日志路径
kyuubi.operation.log.dir              /opt/kyuubi/logs/operation
