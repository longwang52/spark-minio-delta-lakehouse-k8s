# ============================================================
# Spark Defaults Configuration
# - Spark Master: spark://spark-master.lakehouse.svc.cluster.local:7077
# - Delta Lake: 本地 JAR 包（不使用在线下载）
# - MinIO S3: minio.minio.svc.cluster.local:9000
# - Spark History: 日志写入 MinIO sparkhistory bucket
# ============================================================

# ==================== Spark Master 配置 ====================

# Spark 集群 Master 地址（使用 K8s Service DNS）
spark.master                          spark://spark-master.lakehouse.svc.cluster.local:7077

# ==================== Delta Lake 配置 ====================

# Delta Lake SQL 扩展（启用 Delta 语法支持）
spark.sql.extensions                  io.delta.sql.DeltaSparkSessionExtension

# Delta Lake Catalog 实现
spark.sql.catalog.spark_catalog       org.apache.spark.sql.delta.catalog.DeltaCatalog

# ==================== 本地 JAR 包路径（全部使用本地路径，不在线下载） ====================
# JAR 包通过 PVC 挂载到 /opt/hadoop-libs 目录
# 包含：delta-core, hadoop-aws, aws-java-sdk, kyuubi 相关包

# Spark 依赖 JAR 包
spark.jars                            /opt/hadoop-libs/spark/delta-core_2.12-2.4.0.jar,\
                                      /opt/hadoop-libs/spark/delta-storage-2.4.0.jar,\
                                      /opt/hadoop-libs/spark/hadoop-aws-3.3.6.jar,\
                                      /opt/hadoop-libs/spark/aws-java-sdk-bundle-1.11.271.jar,\
                                      /opt/hadoop-libs/kyuubi/kyuubi-spark-connector-hive_2.12-1.8.0.jar,\
                                      /opt/hadoop-libs/kyuubi/kyuubi-extension-spark-3-4_2.12-1.8.0.jar

# ==================== S3A / MinIO 配置 ====================

# MinIO 端点（K8s 集群内 DNS）
spark.hadoop.fs.s3a.endpoint          http://minio.minio.svc.cluster.local:9000

# MinIO Access Key
spark.hadoop.fs.s3a.access.key        amdin

# MinIO Secret Key
spark.hadoop.fs.s3a.secret.key        amdin12345

# 使用路径样式访问 MinIO（必须为 true）
spark.hadoop.fs.s3a.path.style.access true

# S3A 文件系统实现
spark.hadoop.fs.s3a.impl              org.apache.hadoop.fs.s3a.S3AFileSystem

# 使用简单凭证提供者
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# S3A 连接数
spark.hadoop.fs.s3a.connection.maximum  100

# ==================== Spark History Server 配置 ====================

# 启用事件日志
spark.eventLog.enabled                true

# 事件日志写入 MinIO sparkhistory bucket（远程存储）
spark.eventLog.dir                    s3a://sparkhistory/eventlogs

# History Server 从 MinIO 读取日志
spark.history.fs.logDirectory         s3a://sparkhistory/eventlogs

# History Server 本地缓存目录
spark.history.store.path              /opt/spark/history-cache

# History Server 更新间隔
spark.history.fs.update.interval      10s

# ==================== Hive Metastore 集成 ====================

# Hive MetaStore URI（K8s DNS）
spark.hadoop.hive.metastore.uris      thrift://hive-metastore.lakehouse.svc.cluster.local:9083

# Warehouse 路径
spark.sql.warehouse.dir               s3a://warehouse/spark

# ==================== 序列化 ====================

# 使用 Kryo 序列化提升性能
spark.serializer                      org.apache.spark.serializer.KryoSerializer

# ==================== 网络与超时 ====================

# Driver 等待 Executor 注册超时
spark.executor.heartbeatInterval      10s

# 网络超时
spark.network.timeout                 120s

# ==================== 动态资源分配（可选） ====================

# 不使用动态分配（Worker 固定配置）
spark.dynamicAllocation.enabled       false
