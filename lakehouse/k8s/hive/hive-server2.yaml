---
# ============================================================
# Service: hive-server2 (NodePort)
# 暴露 HiveServer2 供外部访问（Beeline、JDBC 客户端）
# NodePort 端口: 30000 (Thrift), 30002 (Web UI)
# 通过 VIP 192.168.226.120 访问
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: hive-server2
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: hive-server2
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: hive-server2
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hive-server2
  ports:
    - name: thrift
      port: 10000
      targetPort: 10000
      nodePort: 30000    # 外部访问端口: 192.168.226.120:30000
      protocol: TCP
    - name: webui
      port: 10002
      targetPort: 10002
      nodePort: 30002    # Web UI 访问端口: 192.168.226.120:30002
      protocol: TCP

---
# ============================================================
# Deployment: hive-server2
# 连接 Hive MetaStore 提供 SQL 查询服务
# 镜像: myharbor.com/bigdata/apache/hive:3.1.3
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-server2
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: hive-server2
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: hive-server2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-server2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-server2
        app.kubernetes.io/part-of: lakehouse
        app.kubernetes.io/component: hive-server2
    spec:
      # 等待 MetaStore 就绪后再启动 HiveServer2
      initContainers:
        - name: wait-for-metastore
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for Hive MetaStore at hive-metastore.lakehouse.svc.cluster.local:9083..."
              until nc -z hive-metastore.lakehouse.svc.cluster.local 9083; do
                echo "MetaStore not ready, retrying in 5s..."
                sleep 5
              done
              echo "MetaStore is ready!"

      containers:
        - name: hive-server2
          image: myharbor.com/bigdata/apache/hive:3.1.3
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              # 将 PVC 中的 Hive JAR 复制到 Hive lib
              echo "Copying JARs..."
              cp /opt/hadoop-libs/hive/*.jar /opt/hive/lib/ 2>/dev/null || true
              cp /opt/hadoop-libs/mysql/mysql-connector-java-*.jar /opt/hive/lib/ 2>/dev/null || true

              echo "Starting HiveServer2..."
              hive --service hiveserver2

          ports:
            - name: thrift
              containerPort: 10000
              protocol: TCP
            - name: webui
              containerPort: 10002
              protocol: TCP

          env:
            - name: HIVE_HOME
              value: /opt/hive
            - name: HADOOP_HOME
              value: /opt/hadoop
            - name: HADOOP_OPTS
              value: "-Djava.net.preferIPv4Stack=true"
            - name: HADOOP_HEAPSIZE
              value: "1024"

          volumeMounts:
            # hive-site.xml 配置文件
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
              readOnly: true
            # JAR 包
            - name: hadoop-libs
              mountPath: /opt/hadoop-libs
              readOnly: true

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          livenessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10

      volumes:
        - name: hive-config
          configMap:
            name: hive-config
        - name: hadoop-libs
          persistentVolumeClaim:
            claimName: hadoop-libs-pvc
            readOnly: true

      restartPolicy: Always
