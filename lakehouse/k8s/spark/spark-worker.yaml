---
# ============================================================
# StatefulSet: spark-worker-1
# Worker 节点 1，配置: 2 CPU, 8GB 内存
# 使用 StatefulSet 保证 Pod 名称稳定（spark-worker-1-0）
# hostname 固定为 spark-worker-1
# 镜像: myharbor.com/bigdata/bitnami/spark:3.4.1
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-worker-1
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: spark-worker-1
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: spark
spec:
  replicas: 1
  serviceName: spark-headless   # 关联 Headless Service
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-worker-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-worker-1
        app.kubernetes.io/part-of: lakehouse
        app.kubernetes.io/component: spark
    spec:
      hostname: spark-worker-1
      subdomain: spark-headless

      initContainers:
        - name: wait-for-spark-master
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for Spark Master at spark-master.lakehouse.svc.cluster.local:7077..."
              until nc -z spark-master.lakehouse.svc.cluster.local 7077; do
                echo "Spark Master not ready, retrying in 5s..."
                sleep 5
              done
              echo "Spark Master is ready!"

      containers:
        - name: spark-worker-1
          image: myharbor.com/bigdata/bitnami/spark:3.4.1
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              echo "Copying JARs to Spark lib..."
              mkdir -p /opt/bitnami/spark/jars
              cp /opt/hadoop-libs/spark/*.jar /opt/bitnami/spark/jars/ 2>/dev/null || true
              cp /opt/hadoop-libs/kyuubi/*.jar /opt/bitnami/spark/jars/ 2>/dev/null || true

              echo "Starting Spark Worker 1..."
              exec /opt/bitnami/spark/sbin/start-worker.sh \
                spark://spark-master.lakehouse.svc.cluster.local:7077

          ports:
            - name: web-ui
              containerPort: 8081
              protocol: TCP

          env:
            # Worker 向 Master 注册时使用的主机名（必须可被 Master 解析）
            - name: SPARK_WORKER_HOSTNAME
              value: spark-worker-1.spark-headless.lakehouse.svc.cluster.local
            # 对外公开的 DNS 名称
            - name: SPARK_PUBLIC_DNS
              value: spark-worker-1.spark-headless.lakehouse.svc.cluster.local
            # 本地 hostname（防止 Worker 发送 Pod IP，改为 DNS 名称）
            - name: SPARK_LOCAL_HOSTNAME
              value: spark-worker-1.spark-headless.lakehouse.svc.cluster.local
            # Worker Web UI 端口
            - name: SPARK_WORKER_WEBUI_PORT
              value: "8081"
            # Worker 核心数（2 CPU）
            - name: SPARK_WORKER_CORES
              value: "2"
            # Worker 内存（8GB）
            - name: SPARK_WORKER_MEMORY
              value: "8g"
            # Master URL
            - name: SPARK_MASTER_URL
              value: spark://spark-master.lakehouse.svc.cluster.local:7077
            # Spark 模式
            - name: SPARK_MODE
              value: worker

          volumeMounts:
            # spark-defaults.conf
            - name: spark-config
              mountPath: /opt/bitnami/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
              readOnly: true
            # JAR 包
            - name: hadoop-libs
              mountPath: /opt/hadoop-libs
              readOnly: true

          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"

          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10

      volumes:
        - name: spark-config
          configMap:
            name: spark-config
        - name: hadoop-libs
          persistentVolumeClaim:
            claimName: hadoop-libs-pvc
            readOnly: true

      restartPolicy: Always

---
