---
# ============================================================
# Headless Service: spark-headless
# 用于 Spark Master 和 Worker 之间的稳定 DNS 解析
# Headless Service (clusterIP: None) 将 DNS 解析到具体 Pod IP
# Worker 注册时使用 Pod DNS 名称，解决 Worker -> Master 注册问题
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: spark-headless
  namespace: lakehouse
  labels:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: spark
spec:
  clusterIP: None           # Headless Service 不分配 ClusterIP
  selector:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: spark
  ports:
    - name: spark-master-web
      port: 8080
      targetPort: 8080
    - name: spark-master-rpc
      port: 7077
      targetPort: 7077
    - name: spark-worker-web
      port: 8081
      targetPort: 8081
    - name: spark-history
      port: 18080
      targetPort: 18080
