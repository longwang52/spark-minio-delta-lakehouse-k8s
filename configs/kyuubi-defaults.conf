# =============================================================================
# Kyuubi Defaults Configuration
# Version: 1.8.0
# Namespace: lakehouse
# =============================================================================

# ---------------------------------------------------------------------------
# Kyuubi Server settings
# ---------------------------------------------------------------------------
kyuubi.authentication                            NONE
kyuubi.frontend.thrift.binary.bind.port          10009
kyuubi.frontend.rest.bind.port                   10099

# Engine type and share level
# ENGINE_SHARE_LEVEL=SERVER: one Spark engine shared per Kyuubi server instance
kyuubi.engine.type                               SPARK_SQL
kyuubi.engine.share.level                        SERVER
kyuubi.session.engine.initialize.timeout         PT5M

# ---------------------------------------------------------------------------
# Spark Standalone Cluster
# ---------------------------------------------------------------------------
spark.master                                     spark://spark-master.lakehouse.svc.cluster.local:7077

# ---------------------------------------------------------------------------
# S3A / MinIO settings
# ---------------------------------------------------------------------------
spark.hadoop.fs.s3a.endpoint                     http://minio.minio:9000
spark.hadoop.fs.s3a.access.key                   admin
spark.hadoop.fs.s3a.secret.key                   admin12345
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.AbstractFileSystem.s3a.impl      org.apache.hadoop.fs.s3a.S3A
spark.hadoop.fs.s3a.connection.ssl.enabled       false

# ---------------------------------------------------------------------------
# Delta Lake extensions
# ---------------------------------------------------------------------------
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalog.spark_catalog.type             hive

# ---------------------------------------------------------------------------
# Hive Metastore
# ---------------------------------------------------------------------------
spark.hadoop.hive.metastore.uris                 thrift://hive-metastore.lakehouse.svc.cluster.local:9083
spark.sql.warehouse.dir                          s3a://warehouse/

# ---------------------------------------------------------------------------
# Event Log
# ---------------------------------------------------------------------------
spark.eventLog.enabled                           true
spark.eventLog.dir                               s3a://sparkhistory/
