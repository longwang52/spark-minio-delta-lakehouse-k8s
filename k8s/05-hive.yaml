apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:10-alpine
          command: ["/bin/sh", "-c", "until pg_isready -h postgres -p 5432 -U admin -d metastore_db; do sleep 2; done"]
      containers:
        - name: hive-metastore
          image: apache/hive:3.1.3
          command: ["/bin/bash", "/entrypoint.sh"]
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: HIVE_CUSTOM_CONF_DIR
              value: /opt/hive/conf
            - name: IS_RESUME
              value: "false"
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: hive-entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
      volumes:
        - name: hive-config
          configMap:
            name: hive-config
            items:
              - key: hive-site.xml
                path: hive-site.xml
        - name: hive-entrypoint
          configMap:
            name: hive-config
            defaultMode: 0755
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: lakehouse
spec:
  selector:
    app: hive-metastore
  ports:
    - name: thrift
      port: 9083
      targetPort: 9083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-server
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-server
  template:
    metadata:
      labels:
        app: hive-server
    spec:
      initContainers:
        - name: wait-metastore
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until nc -z hive-metastore 9083; do sleep 2; done"]
      containers:
        - name: hive-server
          image: apache/hive:3.1.3
          command: ["/bin/bash", "/entrypoint.sh"]
          env:
            - name: SERVICE_NAME
              value: hiveserver2
            - name: HIVE_CUSTOM_CONF_DIR
              value: /opt/hive/conf
            - name: IS_RESUME
              value: "true"
          ports:
            - containerPort: 10000
            - containerPort: 10002
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: hive-entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
      volumes:
        - name: hive-config
          configMap:
            name: hive-config
            items:
              - key: hive-site.xml
                path: hive-site.xml
        - name: hive-entrypoint
          configMap:
            name: hive-config
            defaultMode: 0755
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
---
apiVersion: v1
kind: Service
metadata:
  name: hive-server
  namespace: lakehouse
spec:
  selector:
    app: hive-server
  ports:
    - name: hive-thrift
      port: 10000
      targetPort: 10000
    - name: hive-webui
      port: 10002
      targetPort: 10002
