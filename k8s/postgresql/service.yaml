---
# PostgreSQL ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: lakehouse
  labels:
    app: postgresql
    app.kubernetes.io/part-of: lakehouse
spec:
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
