apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyuubi
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyuubi
  template:
    metadata:
      labels:
        app: kyuubi
    spec:
      initContainers:
        - name: wait-spark-master
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until nc -z spark-master 7077; do sleep 2; done"]
      containers:
        - name: kyuubi
          image: apache/kyuubi:1.8.0-spark
          envFrom:
            - secretRef:
                name: lakehouse-secrets
          ports:
            - containerPort: 10009
            - containerPort: 10099
          volumeMounts:
            - name: kyuubi-config
              mountPath: /opt/kyuubi/conf/kyuubi-defaults.conf
              subPath: kyuubi-defaults.conf
      volumes:
        - name: kyuubi-config
          configMap:
            name: kyuubi-config
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi
  namespace: lakehouse
spec:
  selector:
    app: kyuubi
  ports:
    - name: jdbc
      port: 10009
      targetPort: 10009
    - name: webui
      port: 10099
      targetPort: 10099
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi-nodeport
  namespace: lakehouse
spec:
  type: NodePort
  selector:
    app: kyuubi
  ports:
    - name: jdbc
      port: 10009
      targetPort: 10009
      nodePort: 31009
    - name: webui
      port: 10099
      targetPort: 10099
      nodePort: 31099
