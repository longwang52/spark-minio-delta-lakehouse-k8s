---
# PVC：Spark 事件日志存储（用于 History Server）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-logs-pvc
  namespace: lakehouse
  labels:
    app: spark
    component: history-server
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
# PVC：Hive Metastore 本地数据（可选，如果使用外部 PostgreSQL 可不用）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hive-metastore-pvc
  namespace: lakehouse
  labels:
    app: hive
    component: metastore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
