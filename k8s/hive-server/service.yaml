---
# HiveServer2 ClusterIP Service - internal Thrift access on port 10000
apiVersion: v1
kind: Service
metadata:
  name: hive-server
  namespace: lakehouse
  labels:
    app: hive-server
    app.kubernetes.io/part-of: lakehouse
spec:
  selector:
    app: hive-server
  ports:
    - name: thrift
      port: 10000
      targetPort: 10000
  type: ClusterIP
---
# HiveServer2 NodePort Service - external JDBC and Web UI access
apiVersion: v1
kind: Service
metadata:
  name: hive-server-nodeport
  namespace: lakehouse
  labels:
    app: hive-server
    app.kubernetes.io/part-of: lakehouse
spec:
  selector:
    app: hive-server
  ports:
    - name: thrift
      port: 10000
      targetPort: 10000
      nodePort: 30000
    - name: webui
      port: 10002
      targetPort: 10002
      nodePort: 30002
  type: NodePort
