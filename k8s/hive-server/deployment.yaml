---
# HiveServer2 Deployment
# Image: hive-server:3.1.3 (built from docker-images/hive-server/Dockerfile)
# Depends on: hive-metastore
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-server
  namespace: lakehouse
  labels:
    app: hive-server
    app.kubernetes.io/part-of: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-server
  template:
    metadata:
      labels:
        app: hive-server
    spec:
      initContainers:
        # Wait for Hive Metastore to be ready
        - name: wait-for-metastore
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z hive-metastore.lakehouse.svc.cluster.local 9083; do
                echo "Waiting for Hive Metastore..."; sleep 5;
              done
      containers:
        - name: hive-server
          image: hive-server:3.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10000
              name: thrift
            - containerPort: 10002
              name: webui
          env:
            - name: SERVICE_NAME
              value: hiveserver2
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
