apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: bitnami/spark:3.4.1
          command:
            - /opt/bitnami/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
            - --host
            - spark-master
            - --port
            - "7077"
            - --webui-port
            - "8080"
          ports:
            - name: spark
              containerPort: 7077
            - name: webui
              containerPort: 8080
          volumeMounts:
            - name: spark-config
              mountPath: /opt/bitnami/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: spark-config
              mountPath: /opt/bitnami/spark/conf/hive-site.xml
              subPath: hive-site.xml
            - name: spark-apps
              mountPath: /opt/spark-apps/csv_to_delta.py
              subPath: csv_to_delta.py
            - name: spark-apps
              mountPath: /opt/spark-apps/people-100.csv
              subPath: people-100.csv
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
        - name: spark-apps
          configMap:
            name: spark-apps
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: lakehouse
spec:
  selector:
    app: spark-master
  ports:
    - name: spark
      port: 7077
      targetPort: 7077
    - name: webui
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-nodeport
  namespace: lakehouse
spec:
  type: NodePort
  selector:
    app: spark-master
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: lakehouse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: bitnami/spark:3.4.1
          env:
            - name: SPARK_MODE
              value: worker
            - name: SPARK_WORKER_CORES
              value: "2"
            - name: SPARK_WORKER_MEMORY
              value: 5g
            - name: SPARK_MASTER_URL
              value: spark://spark-master:7077
          command:
            - /opt/bitnami/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
          volumeMounts:
            - name: spark-config
              mountPath: /opt/bitnami/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: spark-config
              mountPath: /opt/bitnami/spark/conf/hive-site.xml
              subPath: hive-site.xml
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
