---
# Hive Metastore Deployment
# Image: hive-metastore:3.1.3 (built from docker-images/hive-metastore/Dockerfile)
# Depends on: postgresql
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lakehouse
  labels:
    app: hive-metastore
    app.kubernetes.io/part-of: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
        # Wait for PostgreSQL to be ready before starting the metastore
        - name: wait-for-postgres
          image: postgres:10
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql.lakehouse.svc.cluster.local -p 5432 -U admin; do
                echo "Waiting for PostgreSQL..."; sleep 3;
              done
      containers:
        - name: hive-metastore
          image: hive-metastore:3.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9083
              name: thrift
          env:
            - name: SERVICE_NAME
              value: metastore
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
