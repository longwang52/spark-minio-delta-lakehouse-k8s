---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lakehouse
  labels:
    app: hive
    component: metastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive
      component: metastore
  template:
    metadata:
      labels:
        app: hive
        component: metastore
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 5
              done
              echo "MySQL is ready!"
      containers:
        - name: hive-metastore
          image: apache/hive:3.1.3
          command:
            - /bin/sh
            - -c
            - |
              /opt/hive/bin/schematool -dbType mysql -initSchema --verbose || true
              /opt/hive/bin/hive --service metastore
          ports:
            - name: thrift
              containerPort: 9083
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: mysql
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: hive-config
          configMap:
            name: hive-config
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: lakehouse
  labels:
    app: hive
    component: metastore
spec:
  selector:
    app: hive
    component: metastore
  ports:
    - name: thrift
      port: 9083
      targetPort: 9083
      protocol: TCP
  type: ClusterIP
