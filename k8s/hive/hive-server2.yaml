---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-server2
  namespace: lakehouse
  labels:
    app: hive
    component: server2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive
      component: server2
  template:
    metadata:
      labels:
        app: hive
        component: server2
    spec:
      initContainers:
        - name: wait-for-metastore
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z hive-metastore 9083; do
                echo "Waiting for Hive Metastore..."
                sleep 5
              done
              echo "Hive Metastore is ready!"
      containers:
        - name: hive-server2
          image: apache/hive:3.1.3
          command:
            - /bin/sh
            - -c
            - /opt/hive/bin/hive --service hiveserver2
          ports:
            - name: thrift
              containerPort: 10000
              protocol: TCP
            - name: webui
              containerPort: 10002
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: hiveserver2
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: hive-config
          configMap:
            name: hive-config
---
apiVersion: v1
kind: Service
metadata:
  name: hive-server2
  namespace: lakehouse
  labels:
    app: hive
    component: server2
spec:
  selector:
    app: hive
    component: server2
  ports:
    - name: thrift
      port: 10000
      targetPort: 10000
      protocol: TCP
    - name: webui
      port: 10002
      targetPort: 10002
      protocol: TCP
  type: ClusterIP
