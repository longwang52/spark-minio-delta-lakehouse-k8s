---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: lakehouse
  labels:
    app: spark
    component: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      component: master
  template:
    metadata:
      labels:
        app: spark
        component: master
    spec:
      serviceAccountName: spark
      containers:
        - name: spark-master
          image: apache/spark:3.5.1
          command:
            - /bin/sh
            - -c
            - /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
          ports:
            - name: webui
              containerPort: 8080
              protocol: TCP
            - name: spark
              containerPort: 7077
              protocol: TCP
          env:
            - name: SPARK_MASTER_HOST
              value: "0.0.0.0"
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: spark-config
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: spark-config
              mountPath: /opt/spark/conf/hive-site.xml
              subPath: hive-site.xml
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: lakehouse
  labels:
    app: spark
    component: master
spec:
  selector:
    app: spark
    component: master
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: spark
      port: 7077
      targetPort: 7077
      protocol: TCP
  type: ClusterIP
---
# ServiceAccount for Spark (needed for Spark on Kubernetes)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-role-binding
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: lakehouse
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
